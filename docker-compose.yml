services:
  ml:
    build: ./services/ml
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 2s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      ML_SERVICE_URL: http://ml:8000
    ports:
      - "${GATEWAY_PORT:-18080}:8080"
    depends_on:
      ml:
        condition: service_healthy
